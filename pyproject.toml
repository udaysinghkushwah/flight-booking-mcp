[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "flight-booking-mcp"
version = "1.0.0"
description = "Production-grade Model Context Protocol (MCP) server for flight booking on AWS ECS"
requires-python = ">=3.12"
dependencies = [
    "mcp>=2.2.0",
    "uvicorn[standard]>=0.30.0",
    "starlette>=0.35.0",
    "pydantic>=2.0.0",
    "sqlparse>=0.5.0",
]

[project.optional-dependencies]
test = ["pytest>=7.0", "pytest-asyncio", "httpx"]
dev  = ["ruff", "mypy"]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "agent*"]

[project.scripts]
# Run server: uvicorn src.server:app --port 8080
# Run agent:  python run_agent.py --auto-approve

[tool.pytest.ini_options]
asyncio_mode = "strict"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
select = ["E", "F", "I", "N", "W"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
strict = false
